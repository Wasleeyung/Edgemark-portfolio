<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. BSI (British Standards Institution) Authentic Emblem -->
  <g transform="translate(4, 8)" filter="url(#shadow)">
    <!-- Shield / Badge -->
    <rect x="0" y="0" width="68" height="44" rx="6" fill="#002b49" stroke="#0077c8" stroke-width="1.2"/>
    <!-- BSI Kitemark Symbol -->
    <g transform="translate(6, 6) scale(0.65)">
      <!-- Kitemark heart/shield -->
      <path d="M12,2 C18,2 22,7 22,14 C22,23 12,30 12,30 C12,30 2,23 2,14 C2,7 6,2 12,2 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="2" y1="14" x2="22" y2="14" stroke="#ffffff" stroke-width="2"/>
      <line x1="12" y1="2" x2="12" y2="30" stroke="#ffffff" stroke-width="2"/>
    </g>
    <!-- bsi. text -->
    <text x="26" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="-0.5">bsi.</text>
    <text x="7" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="700" fill="#38bdf8" letter-spacing="0.5">BS 8110/6399</text>
  </g>

  <!-- 2. EN Eurocodes Authentic Emblem -->
  <g transform="translate(78, 8)" filter="url(#shadow)">
    <!-- Badge -->
    <rect x="0" y="0" width="76" height="44" rx="6" fill="#003399" stroke="#ffd700" stroke-width="1.2"/>
    <!-- European Stars Arc -->
    <g transform="translate(14, 15) scale(0.7)">
      <circle cx="0" cy="-8" r="1.5" fill="#ffd700"/>
      <circle cx="6" cy="-6" r="1.5" fill="#ffd700"/>
      <circle cx="8" cy="0" r="1.5" fill="#ffd700"/>
      <circle cx="6" cy="6" r="1.5" fill="#ffd700"/>
      <circle cx="0" cy="8" r="1.5" fill="#ffd700"/>
      <circle cx="-6" cy="6" r="1.5" fill="#ffd700"/>
      <circle cx="-8" cy="0" r="1.5" fill="#ffd700"/>
      <circle cx="-6" cy="-6" r="1.5" fill="#ffd700"/>
    </g>
    <!-- Eurocode typography -->
    <text x="26" y="22" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="0.5">EUROCODE</text>
    <text x="26" y="36" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="800" fill="#ffd700" letter-spacing="0.5">EN 1990-1992</text>
  </g>

  <!-- 3. ACI (American Concrete Institute) Authentic Emblem -->
  <g transform="translate(160, 8)" filter="url(#shadow)">
    <!-- Badge -->
    <rect x="0" y="0" width="74" height="44" rx="6" fill="#0a3a60" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- ACI Hexagon/Cube -->
    <polygon points="14,10 22,14 22,24 14,28 6,24 6,14" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="14" y="22" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">aci</text>
    <!-- Text -->
    <text x="28" y="21" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="0.5">ACI CODE</text>
    <text x="28" y="35" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" fill="#93c5fd" letter-spacing="0.5">318 &#8226; PBD</text>
  </g>
</svg>
