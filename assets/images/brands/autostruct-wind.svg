<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="56" height="56" rx="10" fill="url(#windGrad)" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Aerodynamic Streamlines & Building Profile -->
  <g transform="translate(10, 10)">
    <!-- Tower Outline -->
    <rect x="22" y="14" width="12" height="26" rx="2" fill="rgba(0, 229, 255, 0.2)" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Wind streamlines passing around tower -->
    <path d="M 4 18 Q 16 18, 20 15 Q 24 12, 36 12" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 2 27 Q 14 27, 20 25 Q 26 23, 38 23" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 4 36 Q 16 36, 20 38 Q 24 40, 36 40" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Pressure vortex dots -->
    <circle cx="8" cy="27" r="1.5" fill="#ffffff"/>
    <circle cx="28" cy="22" r="1.5" fill="#00e5ff"/>
  </g>
  <!-- Typography -->
  <text x="70" y="26" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="9" font-weight="800" fill="#00e5ff" letter-spacing="1.5">AUTOSTRUCT</text>
  <text x="70" y="47" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="0.5">WIND</text>
</svg>

