<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="windBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#060e1a"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Technical Engineering Plot Container -->
  <g transform="translate(6, 6)">
    <!-- Aerodynamic Wind Velocity Streamlines & High-Rise Tower -->
    <!-- Tower isometric outline -->
    <polygon points="30,12 40,6 40,38 30,44" fill="rgba(0, 229, 255, 0.12)" stroke="#00e5ff" stroke-width="1.2"/>
    <polygon points="20,18 30,12 30,44 20,48" fill="rgba(255, 255, 255, 0.08)" stroke="#ffffff" stroke-width="1.2"/>
    <polygon points="20,18 30,12 40,6 30,12" fill="rgba(0, 229, 255, 0.25)" stroke="#00e5ff" stroke-width="1"/>
    
    <!-- Floor diaphragm levels -->
    <line x1="20" y1="28" x2="30" y2="22" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5"/>
    <line x1="30" y1="22" x2="40" y2="16" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.5"/>
    <line x1="20" y1="38" x2="30" y2="32" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5"/>
    <line x1="30" y1="32" x2="40" y2="26" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.5"/>

    <!-- Dynamic Wind Pressure Streamlines -->
    <path d="M 2 12 Q 14 12, 18 15 Q 24 20, 29 13 Q 34 8, 48 10" fill="none" stroke="url(#streamGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 24 Q 10 24, 16 22 Q 22 18, 30 22 Q 38 26, 48 24" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 4 36 Q 12 36, 17 38 Q 23 42, 30 40 Q 38 38, 48 40" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Pressure Vector arrows -->
    <polygon points="17,20 20,22 17,24" fill="#00e5ff"/>
    <polygon points="13,10 16,12 13,14" fill="#38bdf8"/>
    <polygon points="14,34 17,36 14,38" fill="#00e5ff"/>
  </g>

  <!-- Professional Software Typography -->
  <text x="64" y="20" font-family="'Montserrat', 'Arial', sans-serif" font-size="8.5" font-weight="800" fill="#00e5ff" letter-spacing="1.5">EDGEMARK</text>
  <text x="64" y="36" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="0.5">AutoStruct&#8482;</text>
  <text x="64" y="49" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#38bdf8" letter-spacing="1">WIND DYNAMICS</text>
</svg>
