<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="etabsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#002244"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077cc"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="56" height="56" rx="10" fill="url(#etabsGrad)" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- 3D Structural Frame Isometric Grid -->
  <g transform="translate(6, 6) scale(0.85)">
    <!-- Back columns -->
    <line x1="26" y1="14" x2="26" y2="46" stroke="#00aaff" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="22" x2="42" y2="54" stroke="#0088cc" stroke-width="2" stroke-linecap="round"/>
    <!-- Floor diaphragms -->
    <polygon points="10,22 26,14 42,22 26,30" fill="rgba(0,229,255,0.18)" stroke="#00e5ff" stroke-width="1.5"/>
    <polygon points="10,36 26,28 42,36 26,44" fill="rgba(0,229,255,0.25)" stroke="#00e5ff" stroke-width="1.5"/>
    <polygon points="10,50 26,42 42,50 26,58" fill="rgba(0,229,255,0.32)" stroke="#00e5ff" stroke-width="1.5"/>
    <!-- Front columns -->
    <line x1="10" y1="22" x2="10" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="30" x2="26" y2="58" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Typography -->
  <text x="70" y="27" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#00e5ff" letter-spacing="1.5">CSi</text>
  <text x="70" y="47" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">ETABS</text>
</svg>