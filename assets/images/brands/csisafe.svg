<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006644"/>
      <stop offset="100%" stop-color="#002218"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="56" height="56" rx="10" fill="url(#safeGrad)" stroke="#00ffaa" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Slab & Foundation Mesh Isometric Grid -->
  <g transform="translate(6, 6) scale(0.85)">
    <!-- Slab Plate -->
    <polygon points="10,26 26,16 44,26 28,36" fill="rgba(0,255,170,0.22)" stroke="#00ffaa" stroke-width="2"/>
    <!-- Mesh lines on slab -->
    <line x1="18" y1="21" x2="36" y2="31" stroke="#00ffaa" stroke-width="1" stroke-opacity="0.7"/>
    <line x1="18" y1="31" x2="35" y2="21" stroke="#00ffaa" stroke-width="1" stroke-opacity="0.7"/>
    <!-- Foundation columns / piles punching through -->
    <line x1="27" y1="26" x2="27" y2="8" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="31" x2="18" y2="48" stroke="#00ffaa" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,2"/>
    <line x1="28" y1="36" x2="28" y2="53" stroke="#00ffaa" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,2"/>
    <line x1="36" y1="31" x2="36" y2="48" stroke="#00ffaa" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,2"/>
  </g>
  <!-- Typography -->
  <text x="70" y="27" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#00ffaa" letter-spacing="1.5">CSi</text>
  <text x="70" y="47" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="0.5">SAFE</text>
</svg>